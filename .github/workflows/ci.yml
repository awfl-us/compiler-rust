name: Native Rust compiler

on:
  push:
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99.1'
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all -- --check
      - name: Unit tests
        run: cargo test --workspace --locked
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  scala-to-native-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Temporary pinned dependency until the typed DSL registry is released.
      - uses: actions/checkout@v4
        with:
          repository: awfl-us/dsl
          ref: 5b041e1e9c5d153e4ff76a9845bfabbbd7d04628
          path: _dsl
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: sbt/setup-sbt@v1
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99.1'
      - name: Publish pinned typed DSL locally
        # dsl's dynver uses release tags when CI=true; force the temporary
        # snapshot coordinate expected by frontend/build.sbt.
        run: cd _dsl && sbt -batch 'set ThisBuild / version := "0.1.0-SNAPSHOT"' publishLocal
      - name: Normalize DSL, test control flow, and load builders via existing compiler
        run: |
          cd frontend
          sbt -batch \
            'Test / runMain us.awfl.compiler.rust.FrontendSmoke' \
            'Test / runMain us.awfl.compiler.rust.ControlFlowSmoke' \
            'Test / runMain us.awfl.compiler.rust.NativeCliSmoke'
      - name: Build and lint all generated Rust fixtures
        run: |
          for name in native-smoke native-switch native-unmatched native-range native-each native-nested native-fold native-early-return native-top-return native-effect native-resume native-two-effects native-range-effect native-range-two-effects native-switch-effects native-nested-switch-effects; do
            cargo build --manifest-path "fixtures/$name/Cargo.toml" --locked
            cargo clippy --manifest-path "fixtures/$name/Cargo.toml" --all-targets --locked -- -D warnings
          done
      - name: Execute compiled AWFL workflows
        run: |
          python3 scripts/test_native_smoke.py
          python3 scripts/test_control_flow.py
          python3 scripts/test_native_protocol.py
