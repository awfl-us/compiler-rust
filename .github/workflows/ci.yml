name: Native Rust compiler

on:
  push:
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99.1'
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all -- --check
      - name: Unit tests
        run: cargo test --workspace --locked
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  scala-to-native-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: awfl-us/workflows
          ref: 59ed80232d8e742fcc6f4520199f56fe5bbd4d19
          path: _workflows
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: sbt/setup-sbt@v1
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99.1'
      - name: Normalize DSL, test control flow, and load builders via existing compiler
        run: |
          cd frontend
          sbt -batch \
            'Test / runMain us.awfl.compiler.rust.FrontendSmoke' \
            'Test / runMain us.awfl.compiler.rust.ControlFlowLoweringSmoke' \
            'Test / runMain us.awfl.compiler.rust.ControlFlowSmoke' \
            'Test / runMain us.awfl.compiler.rust.NativeCliSmoke' \
            'Test / runMain us.awfl.compiler.rust.CelStdlibSmoke' \
            'Test / runMain us.awfl.compiler.rust.TextSubstringSmoke' \
            'Test / runMain us.awfl.compiler.rust.TimeFormatSmoke' \
            'Test / runMain us.awfl.compiler.rust.TimeUuidSmoke' \
            'Test / runMain us.awfl.compiler.rust.ScopedNamesSmoke' \
            'Test / runMain us.awfl.compiler.rust.ParallelIrSmoke' \
            'Test / runMain us.awfl.compiler.rust.TrustedGlobalsSmoke' \
            'Test / runMain us.awfl.compiler.rust.LiteralCollectionsSmoke' \
            'Test / runMain us.awfl.compiler.rust.CelOperatorsSmoke' \
            'Test / runMain us.awfl.compiler.rust.TryRaiseSmoke'
      - name: Compile and execute native Parallel and ParallelFor fork/join
        run: |
          cargo build --manifest-path fixtures/native-parallel-branches/Cargo.toml
          cargo clippy --manifest-path fixtures/native-parallel-branches/Cargo.toml --all-targets --locked -- -D warnings
          cargo build --manifest-path fixtures/native-parallel-for/Cargo.toml
          cargo clippy --manifest-path fixtures/native-parallel-for/Cargo.toml --all-targets --locked -- -D warnings
          for name in native-parallel-caught native-parallel-uncaught; do
            cargo build --manifest-path "fixtures/$name/Cargo.toml"
            cargo clippy --manifest-path "fixtures/$name/Cargo.toml" --all-targets --locked -- -D warnings
          done
          python3 scripts/test_native_parallel.py
      - name: Compile and exercise authenticated execution globals
        run: |
          cargo build --manifest-path fixtures/native-trusted-globals/Cargo.toml
          cargo clippy --manifest-path fixtures/native-trusted-globals/Cargo.toml --all-targets --locked -- -D warnings
          python3 scripts/test_trusted_globals.py
      - name: Execute duplicate-name steps with distinct checkpoint slots
        run: |
          cargo build --manifest-path fixtures/native-scoped-names/Cargo.toml
          cargo clippy --manifest-path fixtures/native-scoped-names/Cargo.toml --all-targets --locked -- -D warnings
          python3 scripts/test_scoped_names.py
      - name: Compile and execute NativeMain deployable ABI 3 artifact
        run: |
          cd frontend
          sbt -batch 'Test / runMain us.awfl.compiler.rust.NativeMain us.awfl.compiler.rust.NativeCliFixture ../fixtures/native-cli-v2 ../runtime'
          cd ..
          manifest=fixtures/native-cli-v2/cli-fixture-increment/manifest.json
          test "$(jq -r '.runtime_abi' "$manifest")" = 3
          test "$(jq -r '.workflow' "$manifest")" = cli-fixture-increment
          cargo build --manifest-path fixtures/native-cli-v2/cli-fixture-increment/Cargo.toml --target-dir "$RUNNER_TEMP/native-cli-target"
          python3 - <<'PYTHON'
          import hashlib
          import json
          import os
          import pathlib
          import subprocess
          import tomllib

          directory = pathlib.Path('fixtures/native-cli-v2/cli-fixture-increment')
          manifest = json.loads((directory / 'manifest.json').read_text())
          source = (directory / 'src/main.rs').read_bytes()
          assert hashlib.sha256(source).hexdigest() == manifest['source_sha256']
          with (directory / 'Cargo.toml').open('rb') as stream:
              package = tomllib.load(stream)['package']['name']
          binary = pathlib.Path(os.environ['RUNNER_TEMP']) / 'native-cli-target/debug' / package
          response = subprocess.run(
              [str(binary)], input=json.dumps({'protocol_version': 2, 'input': 41}),
              text=True, capture_output=True, timeout=20, check=True)
          assert json.loads(response.stdout) == {
              'protocol_version': 2, 'status': 'completed', 'result': 42,
          }, response.stdout
          print('NativeMain generated a publishable ABI 3 crate, compiled and executed Rust')
          PYTHON
      - name: Compile and exercise CEL standard library in generated Rust
        run: |
          cargo build --manifest-path fixtures/native-cel-stdlib/Cargo.toml
          cargo clippy --manifest-path fixtures/native-cel-stdlib/Cargo.toml --all-targets --locked -- -D warnings
          python3 scripts/test_cel_stdlib.py
      - name: Compile and execute native text.substring with Unicode and index bounds
        run: |
          cargo build --manifest-path fixtures/native-text-substring/Cargo.toml
          cargo clippy --manifest-path fixtures/native-text-substring/Cargo.toml --all-targets --locked -- -D warnings
          python3 scripts/test_text_substring.py
      - name: Compile and run native time.format with IANA zones and microseconds
        run: |
          cargo build --manifest-path fixtures/native-time-format/Cargo.toml
          cargo clippy --manifest-path fixtures/native-time-format/Cargo.toml --all-targets --locked -- -D warnings
          python3 scripts/test_time_format.py
      - name: Compile and execute native sys.now and UUIDv4
        run: |
          cargo build --manifest-path fixtures/native-time-uuid/Cargo.toml
          cargo clippy --manifest-path fixtures/native-time-uuid/Cargo.toml --all-targets --locked -- -D warnings
          python3 scripts/test_time_uuid.py
      - name: Compile original DSL literal collections into Rust
        run: |
          cargo build --manifest-path fixtures/native-literal-collections/Cargo.toml
          cargo clippy --manifest-path fixtures/native-literal-collections/Cargo.toml --all-targets --locked -- -D warnings
          python3 scripts/test_literal_collections.py
      - name: Compile and execute original CEL membership and floor division
        run: |
          cargo build --manifest-path fixtures/native-cel-operators/Cargo.toml
          cargo clippy --manifest-path fixtures/native-cel-operators/Cargo.toml --all-targets --locked -- -D warnings
          python3 scripts/test_cel_operators.py
      - name: Build and execute real Rust Try/Raise continuations
        run: |
          for name in catch-raise success nested-catch uncaught runtime-error effect-catch default-log; do
            cargo build --manifest-path "fixtures/native-try-raise/$name/Cargo.toml" --target-dir /tmp/awfl-try-target
            cargo clippy --manifest-path "fixtures/native-try-raise/$name/Cargo.toml" --all-targets --locked --target-dir /tmp/awfl-try-target -- -D warnings
          done
          python3 scripts/test_try_raise.py
      - name: Compile an unchanged production workflow into native Rust
        run: |
          cd frontend
          sbt -batch \
            'set Test / unmanagedSources += file("../_workflows/src/main/scala/us/awfl/workflows/LoadConversationHistory.scala")' \
            'Test / runMain us.awfl.compiler.rust.RealWorkflowSmoke'
          cd ..
          # Test uses original Scala source; no HTTP request is executed here.
          ls fixtures/real-load-history/*/src/main.rs
          for crate in fixtures/real-load-history/*/Cargo.toml; do
            cargo build --manifest-path "$crate" --target-dir "$RUNNER_TEMP/real-workflow-target"
          done
          python3 scripts/test_real_workflow.py "$RUNNER_TEMP/real-workflow-target"
      - name: Compile and run unchanged production Product combinator
        run: |
          cd frontend
          sbt -batch \
            'set Test / unmanagedSources ++= Seq(file("../_workflows/src/main/scala/us/awfl/workflows/evals/Product.scala"), file("src/integration/scala/us/awfl/compiler/rust/RealProductSmoke.scala"))' \
            'Test / runMain us.awfl.compiler.rust.RealProductSmoke'
          cd ..
          # This is the exact, unmodified Product.scala from the pinned workflows checkout.
          for crate in fixtures/real-product/{single,cartesian,empty}/Cargo.toml; do
            cargo build --manifest-path "$crate" --target-dir "$RUNNER_TEMP/real-product-target"
            cargo clippy --manifest-path "$crate" --all-targets --locked \
              --target-dir "$RUNNER_TEMP/real-product-target" -- -D warnings
          done
          python3 scripts/test_real_product.py "$RUNNER_TEMP/real-product-target"
      - name: Build and lint all generated Rust fixtures
        run: |
          for name in native-smoke native-switch native-unmatched native-range native-each native-nested native-fold native-early-return native-top-return native-v2-switch-effects native-v2-nested-switch-effects native-v2-range-two-effects native-v2-nested-range-effects native-v2-each native-v2-fold native-v2-each-effects native-v2-fold-effects native-v2-range-switch-effects native-v2-pure-nested native-v2-deep-switch-effects native-v2-mixed-nested-range; do
            cargo build --manifest-path "fixtures/$name/Cargo.toml"
            cargo clippy --manifest-path "fixtures/$name/Cargo.toml" --all-targets --locked -- -D warnings
          done
      - name: Execute compiled AWFL workflows
        run: |
          python3 scripts/test_native_smoke.py
          python3 scripts/test_control_flow.py
          python3 scripts/test_native_protocol.py

  real-workflow-compatibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: awfl-us/workflows
          ref: main
          path: _audit_workflows
      - uses: actions/checkout@v4
        with:
          repository: awfl-us/workflow-utils
          # Includes the already-merged literal schema and Firebase 404 fixes.
          # Pin this checkout so compatibility results are reproducible.
          ref: 08bda2dfd76d0dd45d21556e455d524d8760e670
          path: _audit_utils
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: sbt/setup-sbt@v1
      - name: Publish workflow helpers to local Ivy cache
        run: |
          cd _audit_utils
          # CI=false selects the local snapshot; only the test job uses it.
          CI=false sbt -batch publishLocal
      - name: Compile current workflows without modifying definitions
        run: |
          cd _audit_workflows
          sbt -batch \
            'set dependencyOverrides += "us.awfl" %% "workflow-utils" % "0.1.0-SNAPSHOT"' \
            compile
      - name: Audit constructed Scala DSL graphs against native compiler
        run: |
          export AWFL_WORKFLOW_UTILS_SNAPSHOT=0.1.0-SNAPSHOT
          AWFL_WORKFLOWS_ROOT="$GITHUB_WORKSPACE/_audit_workflows" \
            ./scripts/audit-real-workflows.sh target/trusted-global-audit.json
          python3 - <<'PYTHON'
          import collections, json
          with open('target/trusted-global-audit.json') as f:
              report = json.load(f)
          counts = collections.Counter()
          for item in report['workflows']:
              reason = item.get('reason') or ''
              if item['status'] == 'emitted':
                  category = 'emitted'
              elif 'requires native lowering' in reason or 'native durable parallel fork/join' in reason:
                  category = 'parallel'
              elif 'unsupported raw CEL/reference' in reason:
                  category = 'raw CEL/reference'
              elif 'requires trusted server bindings' in reason:
                  category = 'trusted execution globals'
              else:
                  category = 'other'
              counts[category] += 1
          print('COMPATIBILITY_COUNTS', dict(counts))
          print('LOAD_ERRORS', report['load_errors'])
          print('UNKNOWN_OPERATIONS', report['unknown_operations'])
          print('RAW_BLOCKERS', [
              (item['workflow'], item['reason'])
              for item in report['workflows']
              if 'unsupported raw CEL/reference' in (item.get('reason') or '')
          ])
          # Source emission is not runtime parity, but newly introduced
          # undeclared variables or unimplemented operations should not
          # silently pass this compatibility job. Only the already-known
          # workflow-local initEnv scope issue is currently exempted.
          unexpected = [
              (item['workflow'], item.get('reason'))
              for item in report['workflows']
              if item['status'] != 'emitted' and not (
                  item['workflow'] == 'evals-experiments-SweBenchLite'
                  and 'initEnvResult_' in (item.get('reason') or '')
                  and 'unsupported raw CEL/reference' in (item.get('reason') or '')
              )
          ]
          assert not report['load_errors'], report['load_errors']
          assert not report['unknown_operations'], report['unknown_operations']
          assert not unexpected, unexpected
          PYTHON
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trusted-global-compatibility-audit
          path: target/trusted-global-audit.json
          if-no-files-found: ignore
