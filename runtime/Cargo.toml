[package]
name = "awfl-native-runtime"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["std"] }
chrono-tz = "0.10"
